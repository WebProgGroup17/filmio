
services:
  # ==========================================
  # 1. POSTGRESQL DATABASE SERVICE
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: filmio_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - filmio-network

  # ==========================================
  # 2. NODE.JS BACKEND SERVICE
  # ==========================================
  backend:
    build: ./backend
    container_name: filmio_backend
    restart: always
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - .env
    environment:
    
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - filmio-network

  # ==========================================
  # 3. REACT FRONTEND SERVICE
  # ==========================================
  frontend:
    build: ./frontend
    container_name: filmio_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:5173" # Avoid Windows port reservation
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3001}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - filmio-network

# ==========================================
# VOLUMES & NETWORKS
# ==========================================
volumes:
  pgdata:

networks:
  filmio-network:
    driver: bridge
