

services:
  # ==========================================
  # 1. POSTGRESQL DATABASE SERVICE
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: filmio_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_this_password_locally
      POSTGRES_DB: filmio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - filmio-network

  # ==========================================
  # 2. NODE.JS BACKEND SERVICE
  # ==========================================
  backend:
    build: ./backend
    container_name: filmio_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=?
      - DB_NAME=filmio
      - DB_PORT=5432
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - filmio-network

  # ==========================================
  # 3. REACT FRONTEND SERVICE
  # ==========================================
  frontend:
    build: ./frontend
    container_name: filmio_frontend
    restart: always
    ports:
      - "5173:5173" # Assuming Vite default port
    environment:
      - VITE_API_URL=http://localhost:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - filmio-network

# ==========================================
# VOLUMES & NETWORKS
# ==========================================
volumes:
  pgdata:

networks:
  filmio-network:
    driver: bridge